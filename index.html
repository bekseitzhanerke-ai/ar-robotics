<nav id="nav"><b>🤖 AR ROBOTICS</b>
<button data-v="home">Басты бет</button><button data-v="theory">Теория және тест</button><button data-v="design">Жобалау</button><button data-v="chip">Чип таңдау</button><button data-v="lab">AR зертхана</button><button data-v="guide">Нұсқаулық</button><button data-v="prog">Бағдарламалау</button><button data-v="def">Қорғау және есеп</button><button data-v="ach">Жетістіктер</button><button data-v="prof">Профиль</button><button data-v="teacher" id="navT" style="display:none">🧑‍🏫 Мұғалім панелі</button><button id="helpBtn" title="Сайтты қолдану нұсқаулығы">❓ Анықтама</button></nav>
<main id="m"></main>
<button id="aiFab" class="btn noprint">🤖 AI көмекші</button>
<div id="aiP" role="dialog" aria-label="AI көмекші"><div id="aiH"><span>🤖 AI көмекші <small id="aiMode" style="font-weight:400"></small></span><button class="btn sm" id="aiX" style="background:#04162b;color:#fff">✕</button></div><div id="aiM"></div><div id="aiQ"></div><form id="aiF"><textarea id="aiIn" placeholder="Сұрағыңызды жазыңыз..."></textarea><button class="btn" type="submit">➤</button></form></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script>
"use strict";
/* ================= КҮЙ, УТИЛИТАЛАР, НАВИГАЦИЯ ================= */
const CFG={
 /* AI көмекші: claude.ai ішінде «sample» мүмкіндігі қолданылады (кілт қажет емес).
    Өз хостингіңізде: API кілті сақталған сервер-проксидің URL-ін жазыңыз (ai-proxy-worker.js қараңыз). Кілтті ешқашан осы файлға жазбаңыз! */
 AI_PROXY_URL:'https://ar-robotics-ai.bekseitzhanerke.workers.dev', // ← ЖАРИЯЛАУ: Cloudflare Worker URL-і, мысалы 'https://ar-robotics-ai.ATAУЫ.workers.dev' (AI және сынып деректері)
 CLASS_API_URL:'', // бос болса, AI_PROXY_URL қолданылады
 /* Серверсіз режимдегі мұғалім коды (тек қарапайым қорғаныс: сервер қосылса, код серверде тексеріледі). Өзгертіңіз! */
 TEACHER_CODE:'MUGALIM-2026',
 HT_VER:['0.10.14','latest'],
 HT_MODEL:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
};
let S;try{S=JSON.parse(localStorage.getItem('are'))}catch(e){}
S=S||{name:'',cls:'',done:{},sc:{},pts:0,parts:[],built:false,prog:[],coded:false,ran:false};
function migrate(){
 if(!S.v){if(typeof S.pg==='string'){S.pgoal=S.pg;S.pg=[]}const o=S.sc||{},n={};if(o[9]!=null)n.F=o[9];if(o[0]!=null)n[0]=o[0];if(o[1]!=null)n[2]=o[1];if(o[2]!=null)n[6]=o[2];S.sc=n;S.les={};Object.keys(n).forEach(k=>{if(k!=='F'&&n[k]>=60)S.les[k]={r:1,v:1,t:1}});S.v=2}
 S.sc=S.sc||{};S.les=S.les||{};S.bld=Array.isArray(S.bld)?S.bld:[];S.pg=Array.isArray(S.pg)?S.pg:[];S.def=S.def||{};S.gc=S.gc||{};S.pts=S.pts||0;S.parts=S.parts||[];S.pid=S.pid||0;
 if(S.name&&!S.role)S.role='student';if(S.role!=='teacher'&&S.demo)S.demo=false;if(S.role==='student')ensureIds();
 if(S.dq&&S.dq.a&&S.dq.a[10]&&!['Arduino Uno','Arduino Nano','Raspberry Pi Pico','LEGO Hub'].includes(S.dq.a[10]))S.dq.a[10]='Arduino Uno';
}
migrate();
let svW=0;
function sv(){if(VIEWING)return;S.ts=Date.now();try{localStorage.setItem('are',JSON.stringify(S))}catch(e){if(!svW++)toast('Браузер жадына сақтау мүмкін болмады. Профильден жобаны файлға сақтаңыз.',5000)};syncSoon()}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],m=$('#m');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const KZM=['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'];
const fmtD=(t,tm)=>{const d=new Date(t);return `${d.getDate()} ${KZM[d.getMonth()]} ${d.getFullYear()} ж.`+(tm?` ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'')};
/* Жүктелетін файл аты: қазақ/орыс әріптері латынға аударылады (кейбір браузерлер кириллица атауын «download» деп сақтайды) */
const TRL={а:'a',ә:'a',б:'b',в:'v',г:'g',ғ:'g',д:'d',е:'e',ё:'yo',ж:'zh',з:'z',и:'i',й:'y',к:'k',қ:'q',л:'l',м:'m',н:'n',ң:'ng',о:'o',ө:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ұ:'u',ү:'u',ф:'f',х:'kh',һ:'h',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ъ:'',ы:'y',і:'i',ь:'',э:'e',ю:'yu',я:'ya'};
const fname=s=>String(s||'').toLowerCase().split('').map(c=>TRL[c]!=null?TRL[c]:c).join('').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'joba';
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();

/* claude.ai артефакт мүмкіндіктері (жоқ болса — null) */
const CAP={};
function capUse(n){if(CAP[n])return CAP[n];if(!(window.claude&&typeof window.claude.use==='function'))return Promise.resolve(null);return CAP[n]=Promise.resolve().then(()=>window.claude.use(n)).catch(()=>null)}

/* Диалог пен хабарлама (alert/confirm артефакт терезесінде бұғатталған) */
function dlg(html,btns=[['Жақсы',true]]){return new Promise(res=>{const d=$('#dlg');d.innerHTML=`<div class="dbox">${html}<div class="right" style="margin-top:14px">${btns.map((b,i)=>`<button class="btn ${i<btns.length-1?'s':''}" data-di="${i}">${b[0]}</button>`).join('')}</div></div>`;d.style.display='flex';d.onclick=e=>{const i=e.target.dataset.di;if(i!=null){d.style.display='none';d.onclick=null;res(btns[+i][1])}}})}
const yes=(msg,ok='Иә')=>dlg(`<p>${msg}</p>`,[['Болдырмау',false],[ok,true]]);
let tT;function toast(t,ms=2800){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tT);tT=setTimeout(()=>e.style.display='none',ms)}

/* Файл жүктеу: claude.ai-да downloads мүмкіндігі, өз хостингте — кәдімгі жүктеу */
async function saveFile(name,data,mime){
 const dl=await capUse('downloads');
 if(dl){try{await dl.save({filename:name,data});toast('Файл сақталды: '+name);return true}catch(e){const c=e&&e.code;if(c==='declined'){toast('Жүктеу болдырылмады');return false}if(c==='rate_limited'){toast('Сәл күтіп, қайталаңыз');return false}if(c&&c!=='unavailable'&&c!=='not_granted'){toast('Жүктеу мүмкін болмады: '+(e.message||c));return false}}}
 try{const b=new Blob([data],{type:mime||'application/octet-stream'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);if(inFrame)toast('Жүктеу басталмаса, бетті браузерде тікелей ашыңыз.',4000);return true}catch(e){toast('Жүктеу мүмкін болмады');return false}}

let cur='home',tick=0;
function stopAll(){cancelAnimationFrame(tick);tick=0;vStop();if(typeof simHalt==='function')simHalt()}
function show(v,arg){if(!R[v])v='home';stopAll();navUpd();cur=v;m.onclick=null;m.oninput=null;m.onchange=null;$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));R[v](arg);scrollTo(0,0);if(location.hash.slice(1)!==v){try{location.hash=v}catch(e){}}}
function lockCard(msg,v,label){m.innerHTML=`<div class="card"><h3>🔒 Бұл бөлім әлі жабық</h3><p>${msg}</p>${v?`<button class="btn" onclick="show('${v}')">${label}</button>`:''}</div>`;return 1}
const need=()=>!S.name&&lockCard('Алдымен профильде тіркеліңіз — прогресс сонда сақталады.','prof','Тіркелу');
const pass=i=>(S.sc[i]||0)>=60,nl=()=>L.filter((_,i)=>pass(i)).length,canPractice=()=>!!(DEMO()||pass('F'));
const pj=()=>({name:(S.def.pn||(S.dq&&S.dq.a[1])||'Менің роботым'),type:S.rt||T[5].n});

function stages(){const c=k=>L.filter((_,i)=>S.les[i]&&S.les[i][k]).length;
 return[['Теория','theory',c('r'),L.length],['Бейнесабақ','theory',c('v'),L.length],['Тапсырма','theory',c('t'),L.length],['Тест','theory',nl()+(pass('F')?1:0),L.length+1],['Робот құрастыру','lab',S.built?1:0,1],['Бағдарламалау','prog',S.pg.length?1:0,1],['Симуляция','prog',S.simRes&&S.simRes.ok?1:S.ran?.5:0,1],['Жобаны қорғау','def',S.def.done?1:0,1],['Word есебі','def',S.repAt?1:0,1]]}
function pct(){const s=stages();return Math.round(s.reduce((a,x)=>a+x[2]/x[3],0)/s.length*100)}

{t:'Робототехникаға кіріспе',vq:['робототехника негіздері сабақ','основы робототехники урок'],
x:`<p><b>Робототехника</b> — роботтарды жобалау, құрастыру, бағдарламалау және басқаруды зерттейтін ғылым мен инженерия саласы. Ол механиканы, электрониканы және информатиканы біріктіреді.</p>
<p>«Робот» сөзін 1920 жылы чех жазушысы Карел Чапек «R.U.R.» пьесасында қолданған. Сөз чех тіліндегі «robota» — «ауыр жұмыс» деген ұғымнан шыққан.</p>
<h4>Робот дегеніміз не?</h4><p>Робот — қоршаған ортадан ақпарат алатын (<b>сезіну</b>), оны бағдарлама бойынша өңдейтін (<b>ойлау</b>) және соған сай қозғалатын (<b>әрекет</b>) бағдарламаланатын құрылғы. Бұл үздіксіз қайталанатын цикл: робот әрекет еткен сайын орта өзгереді, датчик оны қайта сезеді.</p>
<h4>Роботтың үш негізгі бөлігі</h4><ul><li><b>Механикалық бөлік</b> — корпус, дөңгелектер, тісті берілістер, манипулятор буындары.</li><li><b>Электрондық бөлік</b> — контроллер, датчиктер, қозғалтқыштар, қуат көзі, сымдар.</li><li><b>Бағдарламалық бөлік</b> — роботтың әрекетін анықтайтын алгоритм мен код.</li></ul>
<h4>Роботтардың түрлері</h4><ul><li><b>Мобильді роботтар</b> — орнын ауыстыра алады: робот-шаңсорғыш, қойма роботтары, Марс роверлері.</li><li><b>Манипуляторлар</b> — «робот-қол»: өндірісте бөлшектерді жинайды, дәнекерлейді, бояйды.</li><li><b>Гуманоидтар</b> — адамға ұқсас роботтар.</li><li><b>Ұшқышсыз аппараттар</b> — дрондар.</li></ul>
<h4>Қолданылу салалары</h4><p>Өндіріс (жинау конвейерлері), медицина (хирургиялық көмекші жүйелер), ауыл шаруашылығы (егін жинау, бақылау), ғарыш (зерттеу аппараттары), логистика, күнделікті тұрмыс. Робот адамды қауіпті, ауыр немесе бірсарынды жұмыстан босатады.</p>`,

{t:'Роботтың құрылысы',vq:['мобильді робот құрылысы шасси','устройство мобильного робота шасси'],
x:`<p>Кез келген мобильді робот бірнеше құрылымдық бөліктен тұрады. Олардың әрқайсысы өз қызметін атқарады және дұрыс орналасуы керек.</p>
<h4>Корпус (шасси, рама)</h4><p>Корпус — барлық бөлшек бекітілетін негіз. Ол берік, бірақ жеңіл болуы керек. LEGO Technic жүйесінде корпус арқалықтардан (beam) және рамалардан (frame) жиналып, түйреуіштермен (pin) бекітіледі.</p>
<h4>Қозғалыс механизмі</h4><ul><li><b>Дөңгелекті</b> — ең қарапайым әрі кең тараған. Көбіне <b>дифференциалды жетек</b> қолданылады: екі жетекші дөңгелек (әрқайсысында өз моторы) және артқы тірек дөңгелегі.</li><li><b>Шынжырлы</b> — тегіс емес жерде жақсы жүреді, бірақ баяулау.</li><li><b>Аяқты</b> — күрделі, тепе-теңдікті басқаруды қажет етеді.</li></ul>
<h4>Беріліс механизмдері</h4><p>Тісті дөңгелектер айналуды бір біліктен екіншісіне береді. <b>Беріліс қатынасы</b> = жетектелетін дөңгелектің тіс саны ÷ жетекші дөңгелектің тіс саны. Мысалы, 12 тісті дөңгелек 36 тістіні айналдырса, қатынас 3:1 — шығыс білік 3 есе баяу, бірақ 3 есе күшті айналады. Біліктер (axle) дөңгелекті моторға жалғайды.</p>
<h4>Орналастыру ережелері</h4><ul><li>Ауырлық центрі <b>төмен және ортада</b> болуы керек — робот аударылмайды.</li><li>Датчиктер өз қызметіне сай орнатылады: ультрадыбыстық — алдыңғы жағына, ИК сызық датчигі — астына қарай.</li><li>Контроллердің порттарына қол жеткізу оңай болуы керек.</li><li>Сымдар қозғалатын бөлшектерге (дөңгелекке) ілінбеуі тиіс.</li><li>Бөлшектер бір-біріне қиылыспай, нық бекітілуі қажет.</li></ul>`,

{t:'Контроллерлер',vq:['Arduino Uno сабақ қазақша','Arduino Raspberry Pi Pico сравнение для начинающих'],
x:`<p><b>Микроконтроллер</b> — бір чипке сыйған шағын компьютер: онда процессор, жад және кіріс/шығыс порттары (GPIO) бар. Контроллер датчиктерден сигнал алады, бағдарламаны орындайды және моторларға команда береді.</p>
<h4>Пиндер мен сигналдар</h4><ul><li><b>Цифрлық пин</b> — екі күй: HIGH (1) немесе LOW (0).</li><li><b>Аналогтық кіріс</b> — кернеуді санға айналдырады. Arduino Uno-да 10-биттік түрлендіргіш: 0–5 В → 0–1023.</li><li><b>PWM шығыс</b> (импульсті-енді модуляция) — пин жылдам қосылып-өшеді; қосулы уақыт үлесі мотор жылдамдығын немесе жарықтықты реттейді.</li></ul>
<h4>Төрт негізгі контроллер</h4>
<table class="t"><tr><th>Контроллер</th><th>Ерекшелігі</th><th>Тілі</th></tr>
<tr><td>Arduino Uno</td><td>ATmega328P, 14 цифрлық (6-уы PWM) + 6 аналогтық пин, 5 В логика</td><td>Arduino C/C++</td></tr>
<tr><td>Arduino Nano</td><td>Uno-ның шағын нұсқасы, 8 аналогтық кіріс, шағын роботтарға ыңғайлы</td><td>Arduino C/C++</td></tr>
<tr><td>Raspberry Pi Pico</td><td>RP2040 (екі ядролы), 26 GPIO, 3,3 В логика, жылдам әрі арзан</td><td>MicroPython, C/C++</td></tr>
<tr><td>LEGO Hub</td><td>6 порт (A–F), кірістірілген аккумулятор, Bluetooth, гироскоп</td><td>Блоктар, Python</td></tr></table>
<h4>Маңызды ереже</h4><p>Контроллер пині тек аз ток бере алады (ондаған миллиампер). Сондықтан DC моторды пинге <b>тікелей қосуға болмайды</b> — ол үшін <b>Motor Driver</b> қолданылады. LEGO Hub-та драйвер порттың ішінде орнатылған, сондықтан LEGO моторлары тікелей жалғанады.</p>
<p>Бағдарлама компьютерде жазылып, USB кабелі арқылы контроллерге жүктеледі. Arduino бағдарламасы екі бөліктен тұрады: <code>setup()</code> — бір рет орындалады, <code>loop()</code> — үздіксіз қайталанады.</p>`,

{t:'Датчиктер және олардың қызметі',vq:['ультрадыбыстық датчик HC-SR04 Arduino','датчики робота ультразвуковой ИК датчик линии'],
x:`<p><b>Датчик (сенсор)</b> — физикалық шаманы (қашықтық, жарық, түс, қысым, бұрыш) контроллер түсінетін электр сигналына айналдыратын құрылғы. Датчиктер — роботтың «сезім мүшелері».</p>
<h4>Негізгі датчиктер</h4>
<table class="t"><tr><th>Датчик</th><th>Не өлшейді</th><th>Қайда орнатылады</th></tr>
<tr><td>Ультрадыбыстық (HC-SR04)</td><td>Кедергіге дейінгі қашықтық (шамамен 2–400 см)</td><td>Алдыңғы жағына, алға қарай</td></tr>
<tr><td>Инфрақызыл (ИК)</td><td>Беттің жарықты шағылыстыруы: қара сызық / ақ бет</td><td>Астына, жерге қарай</td></tr>
<tr><td>Түс датчигі</td><td>Заттың түсі (қызыл, жасыл, көк құрамдас)</td><td>Затқа жақын</td></tr>
<tr><td>Жарық датчигі</td><td>Жарықтылық деңгейі</td><td>Жарыққа қарай</td></tr>
<tr><td>Жанасу датчигі</td><td>Басылды / басылмады (соқтығысу)</td><td>Бампердің алдында</td></tr>
<tr><td>Гироскоп</td><td>Бұрылу бұрышы мен жылдамдығы</td><td>Корпустың ортасында</td></tr></table>
<h4>Ультрадыбыстық датчик қалай жұмыс істейді?</h4><p>TRIG пиніне қысқа импульс беріледі — датчик 40 кГц ультрадыбыс толқынын жібереді. Толқын кедергіден шағылып, қайтып оралғанда ECHO пині уақытты көрсетеді. Дыбыс жылдамдығы ≈ 0,034 см/мкс. Толқын екі рет жол жүретіндіктен: <b>қашықтық = уақыт × 0,034 ÷ 2</b>.</p>
<h4>ИК сызық датчигі</h4><p>Датчик инфрақызыл сәуле жіберіп, шағылғанын қабылдайды. Ақ бет сәулені жақсы шағылыстырады, қара сызық сіңіреді. Осы айырмашылық бойынша робот сызықтың үстінде екенін біледі.</p>
<h4>Аналогтық және цифрлық датчиктер</h4><p>Цифрлық датчик тек екі мән береді (0/1), мысалы, жанасу датчигі. Аналогтық датчик үздіксіз мән береді, мысалы, жарық датчигі. Датчикті қолданбас бұрын оны <b>калибрлеу</b> (нақты жағдайда мәндерін тексеру) пайдалы.</p>`,

{t:'Қозғалтқыштар',vq:['servo мотор Arduino сабақ','DC мотор драйвер L298N Arduino урок'],
x:`<p><b>Қозғалтқыш (мотор)</b> электр энергиясын механикалық қозғалысқа айналдырады. Робототехникада үш түрі жиі қолданылады.</p>
<h4>DC мотор (тұрақты ток моторы)</h4><p>Ток берілгенде үздіксіз айналады. Айналу <b>жылдамдығы</b> кернеуге (немесе PWM толтыру коэффициентіне) тәуелді, <b>бағыты</b> — полярлыққа. Көбіне <b>редуктормен</b> бірге қолданылады: ол айналымды азайтып, күшті (айналдыру моментін) арттырады. Дөңгелекті роботтарда негізгі жетек.</p>
<h4>Servo мотор</h4><p>Берілген <b>бұрышқа</b> (әдетте 0–180°) бұрылып, сол күйде тұрады. Ішінде мотор, редуктор, потенциометр және басқару тақшасы бар — ол бұрышты өзі бақылайды (кері байланыс). 50 Гц сигналмен басқарылады: шамамен 1 мс импульс — 0°, 2 мс — 180°. Манипулятор буындарында, сұрыптау механизмдерінде қолданылады.</p>
<h4>Қадамдық мотор (Stepper)</h4><p>Дискретті <b>қадаммен</b> бұрылады; көп таралған түрінде бір айналым = 200 қадам, яғни 1 қадам = 1,8°. Дәл орналастыру қажет жерде (3D принтер, CNC) қолданылады. Арнайы драйверді қажет етеді.</p>
<h4>Motor Driver (H-көпір)</h4><p>Контроллер мен мотор арасындағы «күшейткіш». Ол батареядан моторға үлкен ток береді, ал контроллерден тек басқару сигналын алады. H-көпірдің төрт кілті ток бағытын ауыстырып, моторды алға немесе артқа айналдырады. Мысалдар: L298N, TB6612FNG. ENA/ENB кірістері — жылдамдық (PWM), IN1–IN4 — бағыт.</p>
<h4>LEGO моторлары</h4><p>LEGO моторларында айналымды санайтын кірістірілген энкодер бар, олар Hub портына тікелей қосылады — бөлек драйвер керек емес.</p>`,

{t:'Роботтың қоректену жүйесі',vq:['робот батарея кернеу реттегіш','питание робота Arduino аккумулятор стабилизатор'],
x:`<p>Роботтың барлық электрондық бөлшегі қуатты <b>қоректену жүйесінен</b> алады. Қуат дұрыс таңдалмаса, робот жұмыс істемейді немесе бөлшектер бүлінеді.</p>
<h4>Негізгі шамалар</h4><ul><li><b>Кернеу (В)</b> — электр «қысымы». Контроллер мен моторлардың өз жұмыс кернеуі бар.</li><li><b>Ток (А, мА)</b> — тізбектегі заряд ағыны. Моторлар көп ток тұтынады.</li><li><b>Сыйымдылық (мА·сағ)</b> — батареяның қанша уақыт жұмыс істейтінін көрсетеді.</li></ul>
<h4>Қуат көздері</h4><ul><li>AA батареялары — 1,5 В (4–6 дана тізбектей).</li><li>Li-ion / Li-Po аккумуляторлары — бір элемент шамамен 3,7 В; екі элемент тізбектей (2S) = 7,4 В.</li><li>LEGO Hub-тың кірістірілген аккумуляторы.</li></ul>
<p><b>Тізбектей</b> қосқанда кернеулер қосылады (3,7 + 3,7 = 7,4 В), <b>параллель</b> қосқанда сыйымдылық артады.</p>
<h4>Жұмыс уақыты</h4><p>Шамамен: <b>уақыт (сағ) ≈ сыйымдылық (мА·сағ) ÷ ток (мА)</b>. Мысалы, 2000 мА·сағ ÷ 500 мА ≈ 4 сағат. Іс жүзінде сәл азырақ.</p>
<h4>Кернеу реттегіш</h4><p>Батарея кернеуі контроллерге тым жоғары болуы мүмкін. Arduino Uno VIN кірісіне 7–12 В береді — ішкі реттегіш оны 5 В-қа түсіреді. Raspberry Pi Pico-ға 1,8–5,5 В керек, сондықтан 7,4 В батареяға <b>сыртқы кернеу реттегіш</b> (мысалы, 5 В-қа түсіретін buck түрлендіргіш) қажет.</p>
<h4>Қауіпсіздік ережелері</h4><ul><li>Полярлықты (+/−) шатастырмаңыз.</li><li>Барлық бөліктің GND-ін (минусын) бір-біріне жалғаңыз — <b>ортақ GND</b>.</li><li>Қысқа тұйықталудан сақтаныңыз; қосқыш (switch) орнатыңыз.</li><li>Li-Po аккумуляторын тек арнайы зарядтағышпен зарядтаңыз.</li></ul>`,

q:[['Екі 3,7 В элементті тізбектей қосқанда кернеу:',['7,4 В','3,7 В','1,85 В'],0,'Тізбектей қосқанда кернеулер қосылады.'],['2000 мА·сағ батарея 500 мА токпен шамамен қанша уақыт жұмыс істейді?',['4 сағат','40 сағат','0,25 сағат'],0,'2000 ÷ 500 = 4.'],['Кернеу реттегіштің қызметі:',['Кернеуді қажет деңгейге түсіріп, тұрақтандыру','Моторды айналдыру','Қашықтықты өлшеу'],0,'Мысалы, 7,4 В → 5 В.'],['Ортақ GND не үшін қажет?',['Барлық сигнал бір нөлдік деңгейге қатысты болуы үшін','Батареяны тез зарядтау үшін','Сымды үнемдеу үшін'],0,'Ортақ «минус» болмаса, сигналдар дұрыс оқылмайды.'],['Raspberry Pi Pico-ның қуат диапазоны (VSYS):',['1,8–5,5 В','7–12 В','220 В'],0,'7,4 В батареяға реттегіш керек.']]},

{t:'Бағдарламалау негіздері',vq:['Arduino бағдарламалау негіздері','основы программирования роботов алгоритм цикл условие'],
x:`<p><b>Алгоритм</b> — мәселені шешуге арналған нақты қадамдар реттілігі. <b>Бағдарлама</b> — алгоритмнің контроллер түсінетін тілде жазылуы.</p>
<h4>Негізгі құрылымдар</h4><ul><li><b>Тізбек</b> — командалар жоғарыдан төмен, бірінен соң бірі орындалады.</li><li><b>Цикл</b> — әрекетті қайталау: «N рет қайтала» немесе «мәңгі қайтала».</li><li><b>Шарт (if / else)</b> — датчик мәніне қарай таңдау: егер қашықтық &lt; 15 см болса — бұрыл, әйтпесе — алға жүр.</li><li><b>Айнымалы</b> — мәнді сақтайтын «қорап»: <code>a = a + 1</code>.</li><li><b>Функция</b> — қайта қолданылатын командалар тобы: <code>forward()</code>, <code>turnRight()</code>.</li></ul>
<h4>Блоктық және мәтіндік бағдарламалау</h4><p>Блоктық бағдарламалауда (Scratch, LEGO) командалар түсті блоктар ретінде жиналады — синтаксистік қате болмайды. Мәтіндік бағдарламалауда код жазылады: Arduino үшін C/C++, Pico мен LEGO үшін Python. Осы платформада екеуі де бар және өзара байланысты.</p>
<h4>Arduino бағдарламасының құрылымы</h4><pre>void setup() {      // бір рет орындалады
  pinMode(13, OUTPUT);
}
void loop() {       // үздіксіз қайталанады
  digitalWrite(13, HIGH); delay(500);
  digitalWrite(13, LOW);  delay(500);
}</pre>
<h4>Жөндеу (debug)</h4><p>Бағдарламаны сынап, қатесін тауып, түзету — инженерлік жұмыстың міндетті бөлігі. Алдымен бағдарламаны қадамдап оқыңыз, датчик мәндерін тексеріңіз, бір өзгерісті ғана енгізіп, қайта сынаңыз.</p>`,

x:`<p>Мобильді роботтың қозғалысы дөңгелектерді басқару арқылы жасалады. Дұрыс алгоритм роботты мақсатқа дәл әрі қауіпсіз жеткізеді.</p>
<h4>Дифференциалды басқару</h4><ul><li>Екі дөңгелек <b>бірдей жылдамдықпен</b> бір бағытта айналса — робот <b>түзу</b> жүреді.</li><li>Дөңгелектер <b>қарама-қарсы</b> айналса — робот <b>орнында</b> бұрылады.</li><li>Бір дөңгелек <b>баяуырақ</b> айналса — робот <b>доғамен</b> бұрылады.</li></ul>
<h4>Жүрілген жол</h4><p>Дөңгелек бір айналғанда шеңбер ұзындығына тең жол жүреді: <b>жол = π × D × айналым саны</b>. Мысалы, D = 6 см, 5 айналым → 3,14 × 6 × 5 ≈ 94 см. Уақыт бойынша басқару (2 секунд алға) қарапайым, бірақ дәлдігі төмен; энкодер арқылы айналымды санау дәлірек.</p>
<h4>Типтік алгоритмдер</h4><ul><li><b>Квадрат бойымен жүру</b>: 4 рет қайтала — алға жүр, 90° бұрыл.</li><li><b>Кедергіден айналып өту</b>: мәңгі қайтала — егер қашықтық &lt; 15 см болса, бұрыл; әйтпесе алға жүр.</li><li><b>Сызық бойымен жүру</b>: датчик сызықты көрсе — бір жаққа, көрмесе — екінші жаққа бұрыл.</li><li><b>Лабиринттен өту</b>: «оң қол ережесі» — қабырғаны үнемі оң жақта ұстап жүру.</li></ul>
<h4>Жылдамдық пен инерция</h4><p>Жылдамдық жоғары болса, робот бірден тоқтай алмайды — тежелу жолы ұзарады. Кедергіге жақындағанда жылдамдықты азайту және бұрылыс алдында қысқа тоқтау ұсынылады.</p>`,

x:`<p>Роботты басқару — оның әрекетін мақсатқа сай бағыттау. Басқару тәсілі робот міндетіне байланысты таңдалады.</p>
<h4>Басқару түрлері</h4><ul><li><b>Қолмен (қашықтан) басқару</b> — адам пульт, смартфон немесе Bluetooth арқылы команда береді.</li><li><b>Автономды басқару</b> — робот датчиктер мен бағдарлама бойынша өзі шешім қабылдайды.</li><li><b>Аралас</b> — адам мақсат береді, робот оны өзі орындайды.</li></ul>
<h4>Ашық және тұйық контур</h4><p><b>Ашық контурда</b> робот команданы нәтижені тексермей орындайды (мысалы, «2 секунд алға»). Дөңгелек тайғанаса немесе батарея әлсіресе, қате жинақталады.</p><p><b>Тұйық контурда (кері байланыс)</b> датчик нәтижені үнемі өлшейді, контроллер <b>қателікті</b> (мақсат − өлшенген мән) есептеп, әрекетті түзетеді. Сызық бойымен жүру, қашықтықты ұстау — тұйық контурдың мысалдары.</p>
<h4>Реттегіштер</h4><ul><li><b>Релелік (қос позициялы)</b>: сызықта — солға, сызықтан тыс — оңға. Қарапайым, бірақ робот «зигзаг» жасайды.</li><li><b>Пропорционалды (P) реттегіш</b>: түзету = Kp × қателік. Қателік үлкен болса — қатты түзетеді, кіші болса — сәл ғана. Қозғалыс тегіс болады.</li><li><b>PID</b> — P-ға интегралдық (I, жинақталған қате) және дифференциалдық (D, қатенің өзгеру жылдамдығы) құрамдастар қосылады.</li></ul>
<h4>Күйлер машинасы</h4><p>Күрделі мінез-құлық бірнеше <b>күйге</b> бөлінеді: «іздеу», «алға жүру», «айналып өту», «тоқтау». Датчик оқиғасы роботты бір күйден екіншісіне ауыстырады.</p>
<h4>Қауіпсіздік</h4><p>Кез келген роботта <b>авариялық тоқтату</b> мүмкіндігі болуы керек: батырма немесе бағдарламадағы STOP командасы.</p>`,

/* ================= БЕЙНЕСАБАҚ: АНИМАЦИЯЛЫҚ САХНАЛАР ================= */
const VH={
rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()},
cl:(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),
ez:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,
bg(g){g.fillStyle='#0b1f3d';g.fillRect(0,0,640,360);g.strokeStyle='#ffffff0d';g.lineWidth=1;for(let x=0;x<=640;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,360);g.stroke()}for(let y=0;y<=360;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(640,y);g.stroke()}},
tx(g,s,x,y,sz=18,c='#eef5ff',al='center'){g.font='600 '+sz+'px system-ui,Segoe UI,Arial,sans-serif';g.fillStyle=c;g.textAlign=al;g.textBaseline='middle';g.fillText(s,x,y)},
box(g,x,y,w,h,c,s,tc='#04162b',sz=16,al=1){g.globalAlpha=VH.cl(al);g.fillStyle=c;VH.rr(g,x,y,w,h,10);g.fill();if(s)s.split('\n').forEach((l,i,a)=>VH.tx(g,l,x+w/2,y+h/2+(i-(a.length-1)/2)*sz*1.25,sz,tc));g.globalAlpha=1},
arr(g,x1,y1,x2,y2,c='#9bd8ff',p=1,w=3){p=VH.cl(p);if(p<=0)return;const x=x1+(x2-x1)*p,y=y1+(y2-y1)*p,a=Math.atan2(y2-y1,x2-x1);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x,y);g.stroke();g.beginPath();g.moveTo(x,y);g.lineTo(x-12*Math.cos(a-.4),y-12*Math.sin(a-.4));g.lineTo(x-12*Math.cos(a+.4),y-12*Math.sin(a+.4));g.fill()},
robot(g,x,y,a,s=1,o={}){if(s<=0)return;g.save();g.translate(x,y);g.rotate(a);g.scale(s,s);g.fillStyle='#222';g.fillRect(-30,-18,10,36);g.fillRect(20,-18,10,36);g.fillStyle=o.c||'#f5c518';VH.rr(g,-20,-28,40,56,6);g.fill();g.fillStyle='#0a7d8c';g.fillRect(-12,-8,24,20);if(o.us!==false){g.fillStyle='#2a7de1';g.fillRect(-14,-34,28,8)}g.fillStyle='#888';g.beginPath();g.arc(0,22,4,0,7);g.fill();g.restore()},
wave(g,x,y,a,t,n=4,c='#5cc8ff',len=120){for(let i=0;i<n;i++){const r=((t*90+i*len/n)%len)+8;g.strokeStyle=c;g.globalAlpha=VH.cl(1-r/len);g.lineWidth=2.5;g.beginPath();g.arc(x,y,r,a-.45,a+.45);g.stroke()}g.globalAlpha=1},
pline(g,P,c,w=3,dash){g.strokeStyle=c;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.setLineDash([])},
flow(g,P,t,c='#ffc857',sp=70,gap=26){let L=0;const seg=[];for(let i=0;i<P.length-1;i++){const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);seg.push(l);L+=l}g.fillStyle=c;for(let d=(t*sp)%gap;d<L;d+=gap){let r=d,i=0;while(i<seg.length&&r>seg[i]){r-=seg[i];i++}if(i>=seg.length)break;const q=r/seg[i],x=P[i][0]+(P[i+1][0]-P[i][0])*q,y=P[i][1]+(P[i+1][1]-P[i][1])*q;g.beginPath();g.arc(x,y,4,0,7);g.fill()}},
motor(g,x,y,r,ang,c='#444b55',lab){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle='#eef5ff';g.lineWidth=4;for(let k=0;k<3;k++){const q=ang+k*2.094;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(q)*r*.8,y+Math.sin(q)*r*.8);g.stroke()}if(lab)VH.tx(g,lab,x,y+r+16,14)},
board(g,x,y,w,h,c,s,led){g.fillStyle=c;VH.rr(g,x,y,w,h,8);g.fill();g.fillStyle='#ffd24a';for(let i=0;i<10;i++)g.fillRect(x+10+i*(w-20)/10,y+4,6,8);g.fillStyle='#111';g.fillRect(x+w/2-22,y+h/2-16,44,28);if(led!=null){g.fillStyle=led?'#ff5252':'#552222';g.beginPath();g.arc(x+w-16,y+h-16,6,0,7);g.fill()}if(s)VH.tx(g,s,x+w/2,y+h-14,13,'#fff')},
bat(g,x,y,w,h,lv,s){g.fillStyle='#222';VH.rr(g,x,y,w,h,6);g.fill();g.fillStyle='#555';g.fillRect(x+w,y+h/3,6,h/3);g.fillStyle=lv>.3?'#3ddc97':'#ff6b6b';g.fillRect(x+4,y+4,(w-8)*VH.cl(lv),h-8);if(s)VH.tx(g,s,x+w/2,y+h+16,14)},
wall(g,x,y,w,h){g.fillStyle='#8a5a2b';g.fillRect(x,y,w,h)}
};

['h-theory','Теория және тест',`<p>«Теория және тест» бөлімінде 9 тақырып бар. Әр тақырыпта түсінікті теория, схемалар, қысқа анимациялық бейнесабақ, бекіту тапсырмасы және тест бар.</p><ul><li>Тесттегі әр сұраққа бір жауап таңдап, «Тексеру» басыңыз. Нәтиже бірден шығады, қате жауаптардың түсіндірмесі көрсетіледі. Әр дұрыс жауап — 10 ұпай.</li><li>60%-дан төмен алсаңыз, теорияны қайталап, тестті қайта тапсыра аласыз — ең жақсы нәтиже сақталады.</li><li>Түсініксіз жер болса, «🤖 AI көмекші» батырмасын басып сұраңыз.</li></ul>`],

['h-guide','Нұсқаулық (9 кезеңдік құрастыру)',`<p>«Нұсқаулық» бөлімі жобаны 9 кезеңге бөліп түсіндіреді: роботтың мақсатын анықтау → контроллер таңдау → қажетті бөлшектерді таңдау → механикалық құрылымды жинау → датчиктер мен қозғалтқыштарды жалғау → бағдарлама жазу → симуляциядан өткізу → қателерді түзету → жобаны сақтау және қорғау. Орындалған кезең ✔ белгісімен автоматты белгіленеді; кезеңді басып, толық түсіндірмені ашасыз.</p><p>Төменде <b>«Қадамдық 3D құрастыру»</b> бар: ол сіздің конструктордағы нақты роботыңыздан жасалады, әр қадамда қай бөлшекті қайда орнату керегін жасыл түспен көрсетеді.</p>`],

['h-def','Жобаны қорғау және Word есебі',`<p>«Қорғау және есеп» бөлімінде қорғау сұрақтарына өз сөзіңізбен жауап бересіз (әр жауап кемінде 6 сөз). Сайт жобаңызды 7 критерий бойынша 100 баллдық жүйемен бағалайды: қорытынды тест (15), тақырыптарды меңгеру (10), роботты құрастыру (20), контроллер мен компоненттер сәйкестігі (10), бағдарламалау (15), симуляция нәтижесі (15), қорғау жауаптары (15).</p><p>Одан кейін <b>«📄 Word есебін жүктеу»</b> басыңыз. Есеп сіздің нақты деректеріңізден жасалады: жоба атауы, мақсаты, контроллер, бөлшектер, роботтың 3D суреті, қосылым кестесі, бағдарлама коды, симуляция нәтижесі, тест нәтижелері және қорытынды. Файлды Word-та ашып, қажет болса өңдей аласыз.</p>`],

['h-save','Прогресті сақтау',`<ul><li>Барлық прогресс осы құрылғының браузерінде <b>автоматты сақталады</b>. Сайтты жауып, кейін ашсаңыз, сол жерден жалғастырасыз.</li><li>Басқа компьютерде жалғастыру немесе сақтық көшірме үшін: «Профиль» → <b>«💾 Жобаны файлға сақтау (.json)»</b>. Басқа құрылғыда «📂 Файлдан жүктеу» арқылы ашасыз.</li><li>Браузер тарихын/деректерін тазаласаңыз, сақталған прогресс өшеді — сондықтан маңызды кезеңнен кейін файлға сақтап қойыңыз.</li><li><b>Мұғалімге тапсыру</b>: онлайн режимде прогресс мұғалімге өзі жіберіледі (Профильде «✔ Мұғалімге жіберілді» жазуы тұрады). Серверсіз режимде «📤 Жобаны мұғалімге тапсыру (.json)» батырмасымен файлды мұғалімге жіберіңіз.</li></ul>`],
['h-teacher','Мұғалімге',`<p><b>🧑‍🏫 Мұғалім панелі</b> (жоғарғы мәзірде) сыныптағы оқушылардың кестесін көрсетеді: прогресс, ұпай, өткен тақырыптар, қорытынды тест, робот, симуляция, қорғау балы және соңғы белсенділік. Жоғарыда — оқушылар саны, орташа прогресс, қорытынды тесттен өткендер және жобасын қорғағандар.</p><ul><li>«Ашу» батырмасы оқушының толық жұмысын көрсетеді: әр тақырып бойынша нәтижелер, роботтың бөлшектері мен қателері, бағдарлама коды, симуляция скриншоты, қорғау жауаптары және бағалау. Сол жерден оқушының <b>Word есебін</b> жүктеуге болады.</li><li>Сынып бойынша сүзгі және «⬇ Кестені жүктеу (.csv)» — кестені Excel-де ашуға болады.</li><li><b>Демо режимі</b> — барлық бөлімнің құлпын ашады, курсты тексеру немесе сабақта көрсету үшін. Ол тек мұғалімге қолжетімді.</li></ul><p><b>Оқушылар қалай көрінеді?</b></p><ul><li><b>🟢 Онлайн режим</b> (сайтқа сервер қосылған): оқушы тіркелгенде және жұмыс істегенде прогресі мұғалімге автоматты жіберіледі. Панель әр 30 секунд сайын жаңарады.</li><li><b>⚪ Серверсіз режим</b>: оқушылар «📤 Жобаны мұғалімге тапсыру (.json)» файлын жібереді; мұғалім панельде «📂 Оқушы файлдарын ашу» арқылы бірнеше файлды бірден ашады.</li></ul><p class="mu">Онлайн режимді сайт әкімшісі бір рет баптайды: Cloudflare Worker + D1 дерекқоры (тегін), мұғалім коды серверде құпия ретінде сақталады. Толық қадамдар жоба файлдарымен бірге берілген README-де.</p>`],
['h-faq','Жиі қойылатын сұрақтар',`<p><b>Келесі тақырып неге ашылмайды?</b><br>Алдыңғы тақырыптың тестінен кемінде 60% алу керек.</p><p><b>Практика бөлімдері неге құлыптаулы?</b><br>9 тақырыптың барлығын және жалпы қорытынды тестті (≥60%) тапсыру керек.</p><p><b>Камера қосылмайды.</b><br>Сайтты https:// мекенжайымен ашыңыз, браузерге камераға рұқсат беріңіз, камераны басқа бағдарлама (Zoom, Teams) қолданып тұрмағанын тексеріңіз.</p><p><b>AI көмекші «офлайн» деп тұр.</b><br>Сервер әлі бапталмаған — көмекші дайын анықтамалықпен жауап береді. Бұл қате емес.</p><p><b>Прогресім жоғалды.</b><br>Браузер деректері тазаланған немесе басқа браузер/құрылғы ашылған болуы мүмкін. Сақталған .json файлыңызды «Профиль» → «📂 Файлдан жүктеу» арқылы ашыңыз.</p><p><b>Мұғалім мені көрмейді.</b><br>Профильде сыныбыңыз дұрыс жазылғанын және «✔ Мұғалімге жіберілді» жазуын тексеріңіз; «📤 Қазір жіберу» басыңыз. Серверсіз режимде файлды мұғалімге жіберіңіз.</p><p><b>Word есебі ашылмайды.</b><br>Файл .docx форматында: Microsoft Word, LibreOffice немесе Google Docs арқылы ашыңыз.</p>`]];
function openHelp(id){let h=$('#help');if(!h){h=document.createElement('div');h.id='help';document.body.appendChild(h)}
 h.innerHTML=`<div class="hp" role="dialog" aria-modal="true" aria-label="Анықтама"><div class="hpH"><b>❓ Сайтты қалай қолдану керек?</b><button class="btn sm" data-hx="1" aria-label="Жабу">✕</button></div><div class="hpB" id="hpB"><div class="hpT">${HELP.map((s,i)=>`<button class="tab" data-hs="${s[0]}">${i+1}. ${s[1]}</button>`).join('')}</div>${HELP.map((s,i)=>`<section id="${s[0]}"><h3>${i+1}. ${s[1]}</h3>${s[2]}</section>`).join('')}<p style="text-align:center;margin-top:18px"><button class="btn" data-hx="1">Түсінікті, жабу</button></p></div></div>`;
 h.classList.add('on');document.body.style.overflow='hidden';
 h.onclick=e=>{if(e.target===h||e.target.closest('[data-hx]'))return closeHelp();const b=e.target.closest('[data-hs]');if(b){const s=$('#'+b.dataset.hs);if(s)$('#hpB').scrollTop=s.offsetTop-$('#hpB').offsetTop-6}};
 setTimeout(()=>{if(id){const s=$('#'+id);if(s)$('#hpB').scrollTop=s.offsetTop-$('#hpB').offsetTop-6}const c=h.querySelector('[data-hx]');if(c)c.focus()},0)}
function closeHelp(){const h=$('#help');if(h&&h.classList.contains('on')){h.classList.remove('on');document.body.style.overflow='';return true}return false}
/* ================= ІСКЕ ҚОСУ ================= */
$$('nav button[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));$('#helpBtn').onclick=()=>openHelp();navUpd();
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==cur&&R[v])show(v)});
$('#aiFab').onclick=()=>{if($('#aiP').classList.contains('on'))$('#aiP').classList.remove('on');else aiOpen()};
$('#aiX').onclick=()=>$('#aiP').classList.remove('on');
$('#aiF').onsubmit=e=>{e.preventDefault();const t=$('#aiIn'),q=t.value;t.value='';aiSend(q)};
$('#aiIn').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();const t=$('#aiIn'),q=t.value;t.value='';aiSend(q)}};
$('#htOff').onclick=()=>htStop();
addEventListener('keydown',e=>{if(e.key==='Escape'){const d=$('#dlg');if(closeHelp())return;if(d.style.display==='flex'){const b=d.querySelector('[data-di="0"]');if(b)b.click()}else $('#aiP').classList.remove('on')}});
setTimeout(()=>{capUse('downloads');aiMode()},0);
show(R[location.hash.slice(1)]?location.hash.slice(1):'home');
if(canSync()&&(!S.syncAt||S.syncAt<(S.ts||0)))syncSoon(3000);
</script></body></html>
